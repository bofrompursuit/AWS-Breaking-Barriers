<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Producer Exchange</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F5F5;--card:#fff;--ink:#39373A;--mute:#737374;--line:#D1D1D3;--acc:#487410;--acc2:#EEF8E0;--brand:#93D73B;--indigo:#313D7F;--link:#0783A1;--warn:#A54623;--warnbg:#FEEBA5}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 Rubik,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:16px;margin:0 auto 0 0}header a{color:var(--acc)}
select,button,textarea{font:inherit}select,textarea{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}button:disabled{opacity:.5}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;max-width:1200px;margin:16px auto;padding:0 16px}
@media(max-width:860px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px}
#log{height:62vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 12px;border-radius:12px;white-space:pre-wrap}.a{background:var(--acc2);align-self:flex-start}.u{background:#ece9df;align-self:flex-end}
.sys{align-self:center;font-size:12px;color:var(--mute)}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}textarea{flex:1;resize:none;height:44px}
aside{padding:14px;font-size:13px;max-height:calc(62vh + 70px);overflow:auto}aside h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:14px 0 6px}aside h2:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}.kv b{color:var(--mute);font-weight:500}
.tool{border-left:3px solid var(--acc);padding:2px 8px;margin:4px 0}.tool.bad{border-color:#b33}
.flag{background:var(--warnbg);color:var(--warn);padding:6px 8px;border-radius:8px;margin:4px 0}
.note{font-size:12px;color:var(--mute);padding:8px 16px}
header{background:var(--indigo);color:#fff;border-bottom:4px solid var(--brand)}header h1{font-family:"Source Serif 4",Georgia,serif;font-size:19px;font-weight:700}header h1 span{color:#D1D1D3!important}header a{color:#BFE58E!important}header label{color:#fff}h2{font-family:Rubik,system-ui,sans-serif}button:hover{background:#6B9D2B}a{color:var(--link)}
</style></head><body>
<header><h1>Fair Trade USA · Producer Exchange <span style="font-weight:400;color:var(--mute)">(sandbox, synthetic data)</span></h1>
<label>Producer <select id="producer"></select></label>
<label>Language <select id="lang"><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option></select></label>
<button id="start">Start conversation</button><a href="/review">Reviewer view →</a></header>
<main>
<section class="panel"><div id="log"><div class="sys">Pick a synthetic producer and start. You are role-playing that producer.</div></div>
<form id="f"><textarea id="t" placeholder="Type as the producer…" disabled></textarea><button id="send" disabled>Send</button></form></section>
<aside class="panel"><h2>Session record</h2><div id="profile" class="kv"></div><h2>Flags</h2><div id="flags">None</div><h2>Tool calls &amp; reasoning</h2><div id="tools">—</div></aside>
</main>
<p class="note" id="prov"></p>
<script>
const $=(s)=>document.querySelector(s);let sid=null,producers=[];
const add=(cls,text)=>{const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;$('#log').append(d);$('#log').scrollTop=1e9;return d};
fetch('/api/producers').then(r=>r.json()).then(d=>{producers=d.producers;$('#producer').innerHTML=producers.map(p=>`<option value="${p.producer_id}">${p.producer_id} · ${p.crop} · ${p.region}, ${p.country}</option>`).join('');$('#prov').textContent=`Model: ${d.provider} / ${d.model} · ${d.standards} standard clauses loaded`;showProfile()});
$('#producer').onchange=()=>{const p=producers.find(x=>x.producer_id===$('#producer').value);$('#lang').value=p.language==='fr'?'fr':'es';showProfile()};
function showProfile(){const p=producers.find(x=>x.producer_id===$('#producer').value);if(!p)return;$('#profile').innerHTML=[['ID',p.producer_id],['Org',p.org_name],['Location',`${p.region}, ${p.country}`],['Crop',p.crop],['Entity (on record)',p.entity_type],['Members',p.members]].map(([k,v])=>`<b>${k}</b><span>${v}</span>`).join('')}
$('#start').onclick=async()=>{const r=await fetch('/api/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({producerId:$('#producer').value,lang:$('#lang').value})}).then(r=>r.json());sid=r.sessionId;$('#log').innerHTML='';add('a',r.greeting);$('#t').disabled=$('#send').disabled=false;$('#t').focus();$('#tools').textContent='—';$('#flags').textContent='None'};
$('#t').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#f').requestSubmit()}};
$('#f').onsubmit=async e=>{e.preventDefault();const m=$('#t').value.trim();if(!m||!sid)return;$('#t').value='';add('u',m);$('#send').disabled=true;const w=add('sys','thinking…');
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sessionId:sid,message:m})}).then(r=>r.json());w.remove();if(r.error)throw new Error(r.error);add('a',r.reply);render(r.state)}catch(err){w.textContent='Error: '+err.message}
 $('#send').disabled=false};
function render(s){const f=[...s.pii.map(p=>`PII flag for human review: ${p.kind} (${p.by})`),...s.outOfScope.map(o=>`Out-of-scope request logged: ${o.category}`)];if(s.closed)f.push(s.closed==='saved'?'Record saved (source = agent conversation, review pending)':'Declined outcome recorded (no content stored)');
 $('#flags').innerHTML=f.length?f.map(x=>`<div class="flag">${x}</div>`).join(''):'None';
 $('#tools').innerHTML=s.reasoningLog.map(l=>`<div class="tool"><b>${l.tool}</b><br>${l.reasoning||''}</div>`).join('')||'—';
 if(s.closed){$('#t').disabled=$('#send').disabled=true;add('sys',s.closed==='saved'?'Conversation stored. Open the reviewer view to see the record.':'Conversation closed. Nothing stored except a declined outcome.')}}
</script></body></html>
